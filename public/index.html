<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shortlink Scanner + Traffic Bot</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#30363d; --txt:#e6edf3;
    --dim:#8b949e; --accent:#2ea043; --amber:#d29922; --red:#f85149; --blue:#388bfd;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .wrap{max-width:1000px;margin:0 auto;padding:24px}
  h1{font-size:18px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:12px;margin-bottom:20px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input[type=text],input[type=number]{
    background:#0d1117;border:1px solid var(--line);color:var(--txt);
    padding:9px 11px;border-radius:6px;font:inherit;outline:none}
  input[type=text]{flex:1;min-width:240px}
  input:focus{border-color:var(--blue)}
  button{
    background:#21262d;border:1px solid var(--line);color:var(--txt);
    padding:9px 13px;border-radius:6px;font:inherit;cursor:pointer;white-space:nowrap}
  button:hover{background:#30363d}
  button.primary{background:var(--accent);border-color:var(--accent);color:#04140a;font-weight:700}
  button.blue{background:#1f6feb;border-color:#1f6feb;color:#fff}
  button:disabled{opacity:.5;cursor:not-allowed}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
  .stat{background:#0d1117;border:1px solid var(--line);border-radius:6px;padding:10px}
  .stat b{display:block;font-size:20px;color:var(--accent)}
  .stat span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
  .link{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .link:last-child{border-bottom:none}
  .link .u{flex:1;min-width:200px;color:var(--blue);word-break:break-all;font-size:12px}
  pre{background:#0d1117;border:1px solid var(--line);border-radius:6px;padding:12px;
      overflow:auto;font-size:12px;max-height:340px;margin:0;white-space:pre-wrap}
  .bar{height:6px;background:#0d1117;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin:10px 0}
  .bar>div{height:100%;background:var(--accent);width:0;transition:width .3s}
  .muted{color:var(--dim);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Shortlink Scanner + Traffic Bot</h1>
  <div class="sub">resolve &rarr; inspect for phishing &rarr; visit like a human through rotating free proxies</div>

  <div class="panel">
    <div class="stats">
      <div class="stat"><b id="sViews">0</b><span>views generated</span></div>
      <div class="stat"><b id="sAttempts">0</b><span>attempts</span></div>
      <div class="stat"><b id="sUsd">$0.0000</b><span>est. earnings</span></div>
      <div class="stat"><b id="sPool">-</b><span>proxies loaded</span></div>
    </div>
    <div class="muted" id="warm" style="margin-top:10px">warming chromium...</div>
  </div>

  <div class="panel">
    <div class="row">
      <input type="text" id="urlIn" placeholder="https://ouo.io/XXXXXX" />
      <button class="primary" id="saveBtn">Save link</button>
      <button id="scanBtn">Scan</button>
      <button class="blue" id="visitBtn">Visit (1 view)</button>
    </div>
    <div class="row" style="margin-top:10px">
      <span class="muted">Burst:</span>
      <input type="number" id="burstN" value="5" min="1" max="50" style="width:80px" />
      <button id="burstBtn">Run burst on saved links</button>
      <button id="clearBtn">Clear links</button>
    </div>
    <div class="bar"><div id="prog"></div></div>
  </div>

  <div class="panel">
    <div class="muted" style="margin-bottom:8px">Saved links (click to load)</div>
    <div id="linkList"><div class="muted">none yet</div></div>
  </div>

  <div class="panel">
    <div class="muted" style="margin-bottom:8px">Output</div>
    <pre id="out">ready.</pre>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const LS = 'ouo_links_v1';
const out = $('out');

const log = (m) => { out.textContent += '\n' + m; out.scrollTop = out.scrollHeight; };
const reset = (m) => { out.textContent = m; };

async function readJson(r) {
  const text = await r.text();
  try { return { j: JSON.parse(text), raw: text, ok: true }; }
  catch { return { j: null, raw: text, ok: false }; }
}

function links() { try { return JSON.parse(localStorage.getItem(LS)) || []; } catch { return []; } }
function saveLinks(l) { localStorage.setItem(LS, JSON.stringify(l)); render(); }

function render() {
  const l = links();
  const el = $('linkList');
  if (!l.length) { el.innerHTML = '<div class="muted">none yet</div>'; return; }
  el.innerHTML = '';
  l.forEach((u, i) => {
    const d = document.createElement('div');
    d.className = 'link';
    d.innerHTML = `<span class="u">${u}</span>`;
    const mk = (t, fn) => { const b = document.createElement('button'); b.textContent = t; b.onclick = fn; return b; };
    d.appendChild(mk('load', () => { $('urlIn').value = u; }));
    d.appendChild(mk('scan', () => doScan(u)));
    d.appendChild(mk('visit', () => doVisit(u)));
    d.appendChild(mk('del', () => { l.splice(i, 1); saveLinks(l); }));
    el.appendChild(d);
  });
}

async function warmUp() {
  const el = $('warm');
  el.textContent = 'warming chromium...';
  try {
    const r = await fetch('/api/warm');
    const { j, raw, ok } = await readJson(r);
    if (!ok) { el.textContent = 'warm: HTTP ' + r.status + ' ' + raw.slice(0, 120); return; }
    el.textContent = j.ok ? 'chromium ready (' + j.ms + 'ms)' : 'chromium FAILED: ' + j.error;
  } catch (e) {
    el.textContent = 'warm failed: ' + e.message;
  }
}

async function refreshStats() {
  try {
    const r = await fetch('/api/stats');
    const { j, ok } = await readJson(r);
    if (!ok) return;
    $('sViews').textContent = j.views ?? 0;
    $('sAttempts').textContent = j.attempts ?? 0;
    $('sUsd').textContent = '$' + (j.estimatedUsd ?? 0).toFixed(4);
  } catch {}
}

async function refreshPool() {
  try {
    const r = await fetch('/api/proxies');
    const { j, ok } = await readJson(r);
    $('sPool').textContent = ok ? (j.count ?? 0) : 'err';
  } catch { $('sPool').textContent = 'err'; }
}

async function doScan(url) {
  if (!url) return;
  reset('scanning ' + url + ' ...');
  try {
    const r = await fetch('/api/resolve?url=' + encodeURIComponent(url));
    const { j, raw, ok } = await readJson(r);
    if (!ok) { reset('HTTP ' + r.status + ' non-JSON:\n' + raw.slice(0, 400)); return; }
    const p = j.phishing;
    reset('');
    log('INPUT   ' + j.input);
    log('HOPS    ' + j.hops);
    log('FINAL   ' + j.final);
    log('');
    log('RISK    [' + p.band.toUpperCase() + '] score ' + p.score + '/100');
    log('HOST    ' + p.host);
    log('');
    log('FLAGS:');
    p.flags.forEach((f) => log('  - ' + f));
    log('');
    log('REDIRECT CHAIN:');
    j.chain.forEach((h, i) => log(`  ${i + 1}. ${h.status} ${h.url}${h.next ? ' -> ' + h.next : ''}`));
  } catch (e) { log('scan failed: ' + e.message); }
}

async function doVisit(url) {
  if (!url) return;
  reset('visiting ' + url + ' (20-50s) ...');
  try {
    const r = await fetch('/api/visit?url=' + encodeURIComponent(url));
    const { j, raw, ok } = await readJson(r);
    if (!ok) {
      log('');
      log('HTTP ' + r.status + ' - non-JSON response:');
      log(raw.slice(0, 400));
      return;
    }
    log('');
    log(j.success ? 'SUCCESS - view generated' : 'FAILED - ' + (j.error || 'no proxy got through'));
    if (j.elapsedMs >= 0) log('elapsed: ' + j.elapsedMs + 'ms  pool: ' + j.poolSize);
    if (j.where) log('where: ' + j.where);
    if (j.proxyUsed) log('proxy: ' + j.proxyUsed);
    if (j.final) log('final: ' + j.final);
    (j.attempts || []).forEach((a, i) =>
      log(`  try${i + 1} ${a.proxy} ok=${a.ok} clicked=${a.clicked} ${a.note || ''}`));
  } catch (e) { log('network error: ' + e.message); }
  refreshStats();
}

async function runBurst() {
  const l = links();
  if (!l.length) { reset('save some links first'); return; }
  const n = Math.max(1, Math.min(50, Number($('burstN').value) || 1));
  const jobs = [];
  for (let i = 0; i < n; i++) jobs.push(l[i % l.length]);

  $('burstBtn').disabled = true;
  reset('burst started: ' + jobs.length + ' visits');
  let done = 0;

  for (const u of jobs) {
    await doVisit(u);
    done++;
    $('prog').style.width = Math.round((done / jobs.length) * 100) + '%';
  }
  $('burstBtn').disabled = false;
  log('');
  log('BURST COMPLETE - ' + done + ' attempted');
  refreshStats();
}

$('saveBtn').onclick = () => {
  const u = $('urlIn').value.trim();
  if (!u) return;
  const l = links();
  if (!l.includes(u)) l.push(u);
  saveLinks(l);
  $('urlIn').value = '';
};
$('scanBtn').onclick = () => doScan($('urlIn').value.trim());
$('visitBtn').onclick = () => doVisit($('urlIn').value.trim());
$('burstBtn').onclick = runBurst;
$('clearBtn').onclick = () => { if (confirm('clear saved links?')) saveLinks([]); };

render();
refreshStats();
refreshPool();
warmUp();
setInterval(refreshStats, 15000);
</script>
</body>
</html>
